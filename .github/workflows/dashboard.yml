name: Dashboard regression
on:
  pull_request:
  push:
    branches: [master, production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: goldgeek_build
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/goldgeek_build
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FEDEX_SANDBOX_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install isolated test database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high
