<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit Details - Gold Geek</title>

  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/style.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/theme.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/css/post-6.css%3Fver=1767980318.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/google-fonts/css/poppins.css%3Fver=1742919930.css">

  <link rel="stylesheet" href="../wp-content/uploads/admin/css/admin.css">
  <link rel="stylesheet" href="../wp-content/uploads/user/css/user.css">

  <link rel="icon" href="../wp-content/uploads/2025/03/cropped-GoldGeekFavicon-32x32.png" sizes="32x32">
</head>
<body class="admin-body">
  <div class="admin-container" style="flex-direction: column;">

    <header class="user-header">
      <a href="index.html" class="user-back-btn">
        <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </a>
      <span id="page-title" style="font-weight: 600; color: var(--e-global-color-secondary);">Kit Details</span>
      <div style="width: 40px;"></div>
    </header>

    <main class="user-main">
      <div id="kit-content"></div>
    </main>

    <nav class="user-bottom-nav">
      <a href="index.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Home
      </a>
      <a href="index.html" class="user-bottom-nav-item active">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
        My Kits
      </a>
      <a href="settings.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>
    </nav>

  </div>

  <script src="../wp-content/uploads/admin/js/mock-data.js"></script>
  <script src="../wp-content/uploads/user/js/user-auth.js"></script>
  <script src="../wp-content/uploads/user/js/user-mock-data.js"></script>
  <script>
    const user = checkAuth();
    if (user) {
      renderKitDetail();
    }

    function renderKitDetail() {
      const params = new URLSearchParams(window.location.search);
      const kitId = params.get('id');

      if (!kitId) {
        window.location.href = 'index.html';
        return;
      }

      const summary = getKitSummaryForUser(kitId);
      if (!summary) {
        window.location.href = 'index.html';
        return;
      }

      const request = getRequestById(kitId);
      const status = STATUSES[summary.status];

      document.getElementById('page-title').textContent = 'Kit #' + kitId.replace('r', '');

      let html = '';

      // Status badge
      html += `
        <div style="text-align: center; margin-bottom: 20px;">
          <span class="admin-badge ${status.badgeClass}" style="font-size: 14px; padding: 8px 16px;">
            ${formatStatusForUser(summary.status)}
          </span>
        </div>
      `;

      // Offer banner (if applicable)
      if (summary.offer && summary.status === 'offer_sent') {
        html += `
          <div class="user-offer-banner">
            <div class="user-offer-label">Your Offer</div>
            <div class="user-offer-amount">${formatCurrency(summary.offer.totalValue)}</div>
            ${summary.offer.expiresAt ? '<div class="user-offer-expires">Expires: ' + formatDate(summary.offer.expiresAt) + '</div>' : ''}
          </div>
          <div class="user-offer-actions">
            <a href="offer-accept.html?id=${kitId}" class="admin-btn admin-btn-success">Accept Offer</a>
            <a href="offer-decline.html?id=${kitId}" class="admin-btn admin-btn-secondary">Decline</a>
          </div>
          <div style="height: 20px;"></div>
        `;
      }

      // Success banner for accepted/paid
      if (summary.status === 'accepted') {
        html += `
          <div class="user-success-banner">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Offer accepted! Payment processing...
          </div>
        `;
      } else if (summary.status === 'paid') {
        html += `
          <div class="user-success-banner">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Payment complete: ${formatCurrency(summary.offer.totalValue)}
          </div>
        `;
      }

      // Shipping label button for digital kits
      if (needsShippingLabel(request)) {
        html += `
          <a href="shipping-label.html?id=${kitId}" class="user-shipping-label-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0021 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 00-1.913-.247M6.34 18H5.25A2.25 2.25 0 013 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 011.913-.247m10.5 0a48.536 48.536 0 00-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5zm-3 0h.008v.008H15V10.5z" />
            </svg>
            Print Shipping Label
          </a>
        `;
      }

      // Physical kit info
      if (request.kitType === 'physical' && ['pending', 'kit_sent'].includes(summary.status)) {
        html += `
          <div class="user-physical-kit-info">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
            </svg>
            <div class="user-physical-kit-info-text">
              Your appraisal kit is on its way! Use the included pre-paid label to ship your items.
            </div>
          </div>
        `;
      }

      // Kit summary
      html += `
        <div class="admin-detail-section">
          <div class="admin-detail-section-title">Kit Summary</div>
          <div class="user-kit-summary">
            <div class="user-kit-summary-row">
              <span class="user-kit-summary-label">Total Items</span>
              <span class="user-kit-summary-value">${summary.itemCount} items</span>
            </div>
            <div class="user-kit-summary-row">
              <span class="user-kit-summary-label">Kit Type</span>
              <span class="user-kit-summary-value">${summary.kitType === 'physical' ? 'Physical Kit' : 'Digital'}</span>
            </div>
            ${summary.trackingNumber ? `
            <div class="user-kit-summary-row">
              <span class="user-kit-summary-label">Tracking</span>
              <span class="user-kit-summary-value" style="font-family: monospace;">${summary.trackingNumber}</span>
            </div>
            ` : ''}
          </div>
        </div>
      `;

      // Timeline
      html += `
        <div class="admin-detail-section">
          <div class="admin-detail-section-title">Timeline</div>
          <div class="admin-timeline">
            ${summary.timeline.slice().reverse().map(event => `
              <div class="admin-timeline-item">
                <div class="admin-timeline-text">${event.event}</div>
                <div class="admin-timeline-date">${formatDate(event.date)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('kit-content').innerHTML = html;
    }
  </script>
</body>
</html>
