  <script src="../wp-content/uploads/admin/js/mock-data.js"></script>
  <script src="../wp-content/uploads/user/js/user-auth.js"></script>
  <script src="../wp-content/uploads/user/js/user-mock-data.js"></script>
  <script>
    const user = checkAuth();
    if (user) {
      const firstName = user.name.split(' ')[0];
      document.getElementById('welcome-title').textContent = 'Welcome, ' + firstName + '!';

      renderKits();
    }

    function renderKits() {
      const activeKits = getActiveKits(user.userId);
      const completedKits = getCompletedKits(user.userId);

      const activeContainer = document.getElementById('active-kits');
      const completedContainer = document.getElementById('completed-kits');

      if (activeKits.length === 0) {
        activeContainer.innerHTML = '<p style="color: var(--status-gray); font-size: 14px;">No active kits</p>';
      } else {
        activeContainer.innerHTML = activeKits.map(kit => renderKitCard(kit)).join('');
      }

      if (completedKits.length === 0) {
        completedContainer.innerHTML = '<p style="color: var(--status-gray); font-size: 14px;">No completed kits yet</p>';
      } else {
        completedContainer.innerHTML = completedKits.map(kit => renderKitCard(kit)).join('');
      }
    }

    function renderKitCard(kit) {
      const summary = getKitSummaryForUser(kit.id);
      const status = STATUSES[kit.status];
      const hasOffer = hasPendingOffer(kit);
      const needsLabel = needsShippingLabel(kit);

      let ctaText = '';
      if (hasOffer) {
        ctaText = 'Review & Respond';
      } else if (needsLabel) {
        ctaText = 'Print Shipping Label';
      }

      const kitTypeLabel = kit.kitType === 'physical' ? 'Physical Kit' : 'Digital';
      const kitTypeBadgeClass = kit.kitType === 'physical' ? 'physical' : 'digital';

      let valueDisplay = '';
      if (summary.offer && summary.offer.totalValue) {
        if (kit.status === 'paid') {
          valueDisplay = '<span class="user-kit-value">Received: ' + formatCurrency(summary.offer.totalValue) + '</span>';
        } else if (hasOffer) {
          valueDisplay = '<span class="user-kit-value">Offer: ' + formatCurrency(summary.offer.totalValue) + '</span>';
        }
      }

      return `
        <a href="kit-detail.html?id=${kit.id}" class="user-kit-card ${hasOffer ? 'highlight' : ''}">
          <div class="user-kit-card-header">
            <div>
              <div class="user-kit-id">Kit #${kit.id.replace('r', '')}</div>
              <div class="user-kit-type">${kitTypeLabel} &bull; ${summary.itemCount || '?'} items</div>
            </div>
            <span class="admin-badge ${status.badgeClass}">${formatStatusForUser(kit.status)}</span>
          </div>
          ${valueDisplay}
          ${ctaText ? '<div class="user-kit-cta">' + ctaText + ' &rarr;</div>' : ''}
          <div class="user-kit-card-footer">
            <span class="user-kit-date">${formatDate(kit.createdAt)}</span>
            <span class="user-kit-type-badge ${kitTypeBadgeClass}">${kit.kitType}</span>
          </div>
        </a>
      `;
    }
  </script>
