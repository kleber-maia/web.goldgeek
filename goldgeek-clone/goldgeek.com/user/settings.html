<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Gold Geek</title>

  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/style.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/theme.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/css/post-6.css%3Fver=1767980318.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/google-fonts/css/poppins.css%3Fver=1742919930.css">

  <link rel="stylesheet" href="../wp-content/uploads/admin/css/admin.css">
  <link rel="stylesheet" href="../wp-content/uploads/user/css/user.css">

  <link rel="icon" href="../wp-content/uploads/2025/03/cropped-GoldGeekFavicon-32x32.png" sizes="32x32">
</head>
<body class="admin-body">
  <div class="admin-container" style="flex-direction: column;">

    <header class="user-header">
      <a href="index.html" class="user-back-btn">
        <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </a>
      <span style="font-weight: 600; color: var(--e-global-color-secondary);">Settings</span>
      <div style="width: 40px;"></div>
    </header>

    <main class="user-main">
      <div class="user-settings-section">
        <div class="user-settings-section-title">Profile</div>
        <div class="user-profile-name" id="profile-name">Loading...</div>
        <div class="user-profile-email" id="profile-email">Loading...</div>
        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--admin-border);">
          <div style="font-size: 12px; color: var(--status-gray); margin-bottom: 4px;">Shipping Address</div>
          <div class="user-profile-address" id="profile-address">Loading...</div>
        </div>
      </div>

      <div class="user-settings-section">
        <div class="user-settings-section-title">Payment Preferences</div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="default-method">Default Payment Method</label>
          <select id="default-method" class="admin-form-select" onchange="updatePaymentPrefs()">
            <option value="check">Check (mailed)</option>
            <option value="paypal">PayPal</option>
            <option value="zelle">Zelle</option>
            <option value="bank_transfer">Bank Transfer</option>
          </select>
        </div>

        <div class="admin-form-group" id="paypal-group" style="display: none;">
          <label class="admin-form-label" for="paypal-email">PayPal Email</label>
          <input type="email" id="paypal-email" class="admin-form-input" placeholder="your.paypal@email.com">
        </div>

        <div class="admin-form-group" id="zelle-group" style="display: none;">
          <label class="admin-form-label" for="zelle-phone">Zelle Phone or Email</label>
          <input type="text" id="zelle-phone" class="admin-form-input" placeholder="(555) 123-4567 or email">
        </div>

        <div class="admin-form-group" id="bank-group" style="display: none;">
          <label class="admin-form-label" for="bank-routing">Routing Number</label>
          <input type="text" id="bank-routing" class="admin-form-input" placeholder="9 digits">
          <label class="admin-form-label" for="bank-account" style="margin-top: 12px;">Account Number</label>
          <input type="text" id="bank-account" class="admin-form-input" placeholder="Account number">
        </div>

        <button onclick="savePaymentPrefs()" class="admin-btn admin-btn-primary admin-btn-full" style="margin-top: 8px;">
          Save Payment Preferences
        </button>
      </div>

      <div class="user-settings-section">
        <div class="user-settings-section-title">Need Help?</div>
        <p style="font-size: 14px; color: var(--status-gray); margin: 0 0 12px 0;">
          Questions about your appraisal or payment?
        </p>
        <a href="mailto:support@goldgeek.com" class="admin-btn admin-btn-secondary admin-btn-full">
          <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
          Contact Support
        </a>
      </div>

      <button onclick="logout()" class="user-logout-btn">
        <svg width="18" height="18" style="display: inline; vertical-align: middle; margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        Log Out
      </button>
    </main>

    <nav class="user-bottom-nav">
      <a href="index.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Home
      </a>
      <a href="index.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
        My Kits
      </a>
      <a href="settings.html" class="user-bottom-nav-item active">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>
    </nav>

  </div>

  <script src="../wp-content/uploads/admin/js/mock-data.js"></script>
  <script src="../wp-content/uploads/user/js/user-auth.js"></script>
  <script src="../wp-content/uploads/user/js/user-mock-data.js"></script>
  <script>
    const user = checkAuth();
    if (user) {
      loadSettings();
    }

    function loadSettings() {
      const customer = getCustomerById(user.userId);

      document.getElementById('profile-name').textContent = customer ? customer.name : user.name;
      document.getElementById('profile-email').textContent = customer ? customer.email : user.email;

      if (customer && customer.address) {
        const addr = customer.address;
        document.getElementById('profile-address').innerHTML =
          addr.street + '<br>' +
          addr.city + ', ' + addr.state + ' ' + addr.zip;
      }

      const prefs = getUserPaymentPreferences(user.userId);
      document.getElementById('default-method').value = prefs.defaultMethod || 'check';

      if (prefs.paypalEmail) {
        document.getElementById('paypal-email').value = prefs.paypalEmail;
      }
      if (prefs.zellePhone) {
        document.getElementById('zelle-phone').value = prefs.zellePhone;
      }

      updatePaymentPrefs();
    }

    function updatePaymentPrefs() {
      const method = document.getElementById('default-method').value;

      document.getElementById('paypal-group').style.display = 'none';
      document.getElementById('zelle-group').style.display = 'none';
      document.getElementById('bank-group').style.display = 'none';

      if (method === 'paypal') {
        document.getElementById('paypal-group').style.display = 'block';
      } else if (method === 'zelle') {
        document.getElementById('zelle-group').style.display = 'block';
      } else if (method === 'bank_transfer') {
        document.getElementById('bank-group').style.display = 'block';
      }
    }

    function savePaymentPrefs() {
      const method = document.getElementById('default-method').value;

      userPaymentPreferences[user.userId] = {
        defaultMethod: method,
        paypalEmail: document.getElementById('paypal-email').value,
        zellePhone: document.getElementById('zelle-phone').value
      };

      alert('Payment preferences saved!');
    }
  </script>
</body>
</html>
