<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Offer - Gold Geek</title>

  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/style.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/themes/hello-elementor/theme.min.css%3Fver=3.3.0.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/css/post-6.css%3Fver=1767980318.css">
  <link rel="stylesheet" href="../wp-content/uploads/elementor/google-fonts/css/poppins.css%3Fver=1742919930.css">

  <link rel="stylesheet" href="../wp-content/uploads/admin/css/admin.css">
  <link rel="stylesheet" href="../wp-content/uploads/user/css/user.css">

  <link rel="icon" href="../wp-content/uploads/2025/03/cropped-GoldGeekFavicon-32x32.png" sizes="32x32">
</head>
<body class="admin-body">
  <div class="admin-container" style="flex-direction: column;">

    <header class="user-header">
      <a href="javascript:history.back()" class="user-back-btn">
        <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </a>
      <span style="font-weight: 600; color: var(--e-global-color-secondary);">Accept Offer</span>
      <div style="width: 40px;"></div>
    </header>

    <main class="user-main">
      <div class="admin-detail-section">
        <div class="admin-detail-section-title">Offer Details</div>
        <div class="user-kit-summary">
          <div class="user-kit-summary-row">
            <span class="user-kit-summary-label">Kit</span>
            <span class="user-kit-summary-value" id="kit-id">Loading...</span>
          </div>
          <div class="user-kit-summary-row">
            <span class="user-kit-summary-label">Total Value</span>
            <span class="user-kit-summary-value" id="offer-value" style="font-size: 18px; color: var(--e-global-color-primary);">Loading...</span>
          </div>
        </div>
      </div>

      <div class="admin-detail-section">
        <div class="admin-detail-section-title">Payment Method</div>

        <label class="user-payment-option" onclick="selectPayment('check')">
          <input type="radio" name="payment" value="check">
          <span class="user-payment-option-label">Check</span>
          <span class="user-payment-option-detail">Mailed to your address</span>
        </label>

        <label class="user-payment-option" onclick="selectPayment('paypal')">
          <input type="radio" name="payment" value="paypal">
          <span class="user-payment-option-label">PayPal</span>
          <span class="user-payment-option-detail" id="paypal-detail">-</span>
        </label>

        <label class="user-payment-option" onclick="selectPayment('zelle')">
          <input type="radio" name="payment" value="zelle">
          <span class="user-payment-option-label">Zelle</span>
          <span class="user-payment-option-detail" id="zelle-detail">-</span>
        </label>

        <label class="user-payment-option" onclick="selectPayment('bank_transfer')">
          <input type="radio" name="payment" value="bank_transfer">
          <span class="user-payment-option-label">Bank Transfer</span>
          <span class="user-payment-option-detail" id="bank-detail">-</span>
        </label>

        <a href="settings.html" style="display: block; text-align: center; margin-top: 12px; font-size: 13px; color: var(--e-global-color-primary);">
          Manage payment methods
        </a>
      </div>

      <p class="user-disclaimer">
        By accepting, you agree to our <a href="../terms-conditions.html">Terms of Service</a>.
      </p>

      <button onclick="confirmAccept()" class="admin-btn admin-btn-success admin-btn-full" id="confirm-btn" disabled>
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="confirm-btn-text">Select a payment method</span>
      </button>
    </main>

    <nav class="user-bottom-nav">
      <a href="index.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Home
      </a>
      <a href="index.html" class="user-bottom-nav-item active">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
        My Kits
      </a>
      <a href="settings.html" class="user-bottom-nav-item">
        <svg class="user-bottom-nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>
    </nav>

  </div>

  <script src="../wp-content/uploads/admin/js/mock-data.js"></script>
  <script src="../wp-content/uploads/user/js/user-auth.js"></script>
  <script src="../wp-content/uploads/user/js/user-mock-data.js"></script>
  <script>
    let kitId = null;
    let offerValue = 0;
    let selectedPayment = null;

    const user = checkAuth();
    if (user) {
      loadOfferData();
    }

    function loadOfferData() {
      const params = new URLSearchParams(window.location.search);
      kitId = params.get('id');

      if (!kitId) {
        window.location.href = 'index.html';
        return;
      }

      const summary = getKitSummaryForUser(kitId);
      if (!summary || !summary.offer) {
        window.location.href = 'index.html';
        return;
      }

      offerValue = summary.offer.totalValue;
      document.getElementById('kit-id').textContent = '#' + kitId.replace('r', '');
      document.getElementById('offer-value').textContent = formatCurrency(offerValue);

      const prefs = getUserPaymentPreferences(user.userId);
      if (prefs.paypalEmail) {
        document.getElementById('paypal-detail').textContent = prefs.paypalEmail;
      }
      if (prefs.zellePhone) {
        document.getElementById('zelle-detail').textContent = prefs.zellePhone;
      }
      if (prefs.bankAccount) {
        document.getElementById('bank-detail').textContent = prefs.bankAccount;
      }

      if (prefs.defaultMethod) {
        selectPayment(prefs.defaultMethod);
        const radio = document.querySelector('input[value="' + prefs.defaultMethod + '"]');
        if (radio) radio.checked = true;
      }
    }

    function selectPayment(method) {
      selectedPayment = method;

      document.querySelectorAll('.user-payment-option').forEach(opt => {
        opt.classList.remove('selected');
      });

      const selected = document.querySelector('input[value="' + method + '"]');
      if (selected) {
        selected.checked = true;
        selected.closest('.user-payment-option').classList.add('selected');
      }

      document.getElementById('confirm-btn').disabled = false;
      document.getElementById('confirm-btn-text').textContent = 'Confirm & Accept - ' + formatCurrency(offerValue);
    }

    function confirmAccept() {
      if (!selectedPayment) {
        alert('Please select a payment method');
        return;
      }

      const success = simulateAcceptOffer(kitId, selectedPayment);
      if (success) {
        window.location.href = 'kit-detail.html?id=' + kitId + '&accepted=true';
      } else {
        alert('Something went wrong. Please try again.');
      }
    }
  </script>
</body>
</html>
